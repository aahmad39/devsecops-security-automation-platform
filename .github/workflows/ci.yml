name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit Scan
        run: |
          bandit -r app/ -f json -o reports/sast.bandit.json || true
      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        with:
          name: sast.bandit.json
          path: reports/sast.bandit.json

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit Scan
        run: |
          pip-audit -r requirements.txt -f json -o reports/sca.pip-audit.json || true
      - name: Upload SCA Report
        uses: actions/upload-artifact@v4
        with:
          name: sca.pip-audit.json
          path: reports/sca.pip-audit.json

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t vulntracker-api:local .
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "vulntracker-api:local"
          format: "json"
          output: "reports/container.trivy.json"
          exit-code: "0"
      - name: Upload Container Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: reports/container.trivy.json

  iac-scan:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Scan
        run: |
          checkov -d terraform/ -o json > reports/iac.checkov.json || true
      - name: Upload IaC Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: reports/iac.checkov.json
